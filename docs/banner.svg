<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f5bd5"/>
      <stop offset="0.45" stop-color="#962fbf"/>
      <stop offset="0.75" stop-color="#d62976"/>
      <stop offset="1" stop-color="#fa7e1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- phone -->
  <g transform="translate(860 30)">
    <rect width="170" height="300" rx="26" fill="#111"/>
    <rect x="10" y="14" width="150" height="272" rx="16" fill="#1c1c1e"/>
    <rect x="22" y="30" width="126" height="16" rx="8" fill="#2c2c2e"/>
    <rect x="22" y="58" width="90" height="26" rx="13" fill="#3a3a3c"/>
    <rect x="58" y="94" width="90" height="26" rx="13" fill="#d62976"/>
    <rect x="22" y="130" width="70" height="92" rx="10" fill="#3a3a3c"/>
    <polygon points="48,162 48,190 70,176" fill="#fff"/>
    <rect x="58" y="232" width="90" height="26" rx="13" fill="#d62976"/>
    <!-- bottom nav: reels slot crossed out -->
    <g fill="#8e8e93">
      <circle cx="35" cy="276" r="5"/><circle cx="60" cy="276" r="5"/>
      <circle cx="110" cy="276" r="5"/><circle cx="135" cy="276" r="5"/>
    </g>
    <g stroke="#ff453a" stroke-width="3" stroke-linecap="round">
      <rect x="77" y="267" width="16" height="18" rx="4" fill="none"/>
      <line x1="72" y1="290" x2="98" y2="262"/>
    </g>
  </g>

  <text x="70" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#fff">InstaLite</text>
  <text x="72" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#fff" fill-opacity="0.92">Instagram without the Reels rabbit hole.</text>
  <text x="72" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#fff" fill-opacity="0.8">Full-screen Android wrapper · no Reels tab · one reel from a friend, then back to the chat</text>
</svg>
